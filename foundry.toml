[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# No `ffi` and no filesystem access: every vector in the test suite is frozen, so the suite runs
# on a clean checkout with nothing installed but Foundry. Regenerating the vectors needs Noir —
# see vectors/ — but verifying them does not.
